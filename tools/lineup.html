<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>lineup — every character</title>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
<style>html,body{margin:0;height:100%;background:#cfe6f2}canvas{display:block;width:100%;height:100%}#n{position:fixed;left:8px;top:6px;font:13px monospace;color:#3a3228}</style>
</head>
<body>
<canvas id="c"></canvas><div id="n"></div>
<script type="module">
// Dev lineup: the kid + every roster look + a few passers-by, side by side, same lighting as
// the hub. ?yaw=<rad> turns everyone; ?zoom=<n>&from=<i> frames n people from index i; ?face=1 crops to heads.
import * as THREE from 'three';
import { createRenderer, createLights } from '../src/world/render.js';
import { createSky, buildEnvironment } from '../src/world/sky.js';
import { createFog } from '../src/world/haze.js';
import { buildPerson } from '../src/town/people/body.js';
import { KID_LOOK } from '../src/town/kid/model.js';
import { ROSTER } from '../src/town/people/roster.js';
import { U } from '../src/core/shaderPatch.js';

const q = new URLSearchParams(location.search), yaw = +(q.get('yaw') || 0.25), zoom = +(q.get('zoom') || 0), from = +(q.get('from') || 0), face = q.has('face');
const renderer = createRenderer(document.getElementById('c'));
const scene = new THREE.Scene();
scene.fog = createFog(); scene.environment = buildEnvironment(renderer); scene.add(createSky());
const lights = createLights(scene);
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 48).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: '#e8d8a8' }));
ground.receiveShadow = true; scene.add(ground);

const looks = [{ id: 'kid', look: KID_LOOK }, ...ROSTER.map(r => ({ id: r.id, look: r.look })),
  { id: 'visitor', look: { skin: '#e0b08a', shirt: '#9a5a8a', hairStyle: 'long', hat: 'none', bottomColor: '#3a3a3a' } },
  { id: 'uncle', look: { scale: 1.3, headScale: 0.86, skin: '#a8764f', shirt: '#f4f1e8', sleeves: 'long', bottom: 'pants', bottomColor: '#4a4a4a', hat: 'none', glasses: true, hairStyle: 'short', hair: '#4a4440' } }];
const people = looks.map(({ id, look }, i) => {
  const p = buildPerson(look); p.mesh.position.set((i - (looks.length - 1) / 2) * 0.9, 0, 0); p.mesh.rotation.y = yaw; scene.add(p.mesh);
  // relaxed arms (the rest pose is a T-ish hang): slight outward, elbows a little bent
  for (const s of [1, -1]) { p.bones[s > 0 ? 'armL' : 'armR'].rotation.z = s * 0.12; p.bones[s > 0 ? 'foreL' : 'foreR'].rotation.x = -0.25; }
  return { id, ...p };
});
document.getElementById('n').textContent = looks.map(l => l.id).join(' · ');

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 200);
const span = zoom ? zoom * 0.9 : looks.length * 0.9, cx = zoom ? (from + (zoom - 1) / 2) * 0.9 - (looks.length - 1) / 2 * 0.9 : 0;
const dist = face ? span * 0.9 : span * 1.15, cy = face ? 1.25 : 0.75;
camera.position.set(cx, cy + (face ? 0.1 : 0.6), dist); camera.lookAt(cx, cy, 0);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight, false); });
renderer.setSize(innerWidth, innerHeight, false);
let t = 0;
renderer.setAnimationLoop(() => { t += 1 / 60; U.time.value = t; lights.follow(new THREE.Vector3(cx, 0.8, 0), 3); renderer.render(scene, camera); });
window.__lineup = { people, scene, camera, renderer };
</script>
</body>
</html>
